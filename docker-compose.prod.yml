# version: '3.9'

services:
  backend-service:
    build: 
      context: packages/cm-backend-service
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      - database
    env_file: .env
    environment:
      - PORT=$BE_SERVICE_PORT
      - PG_HOST=database
      - PG_PORT=5432
      - PG_USER=$PG_USER
      - PG_PASS=$PG_PASS 
      - PG_DB=$PG_DB
      - JWT_SECRET=$JWT_SECRET
    ports:
      - ${BE_SERVICE_PORT}:${BE_SERVICE_PORT}
    volumes:
      - ./packages/cm-backend-service:/usr/app/
      - /usr/app/node_modules
    networks:
      - shared-network
    command: node ./dist/index.js

  web-client:
    build: 
      context: packages/cm-web-client
      dockerfile: Dockerfile.prod
    restart: always
    env_file: .env
    environment:
      - PORT=$WEB_CLIENT_PORT
      - AWS_BUCKET_NAME=$AWS_BUCKET_NAME
      - AWS_BUCKET_REGION=$AWS_BUCKET_REGION
      - AWS_ACCESS_KEY=$AWS_ACCESS_KEY
      - AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    ports:
      - ${WEB_CLIENT_PORT}:${WEB_CLIENT_PORT}
    volumes:
      - ./packages/cm-web-client:/usr/app/
      - /usr/app/node_modules
    networks:
      - shared-network
    command: npm run start

  database:
    image: postgres:16
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: $PG_USER 
      POSTGRES_PASSWORD: $PG_PASS
      POSTGRES_DB: $PG_DB
    ports:
      - 5432:5432
    volumes:
       - dbdata:/var/lib/postgresql/data
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge

volumes:
  dbdata: